<title>時之國．齒輪</title>
<!-- 新版第五章〈時之國（預演）〉小遊戲：齒輪。對應 新版/劇本/第五章.md 的【小遊戲 齒輪】（最新版沒有計時器；城裡村民一直重複同一句是她做的，不在這張卡裡）。
     背景使用定稿的時之國街景（約 9 秒一輪）：噴水池的水噴上去又掉下來、一隻鳥從同一個屋頂飛過去、一片葉子從樹枝掉下來又回到樹枝上；
     城裡每一個鐘都指著 4:47 不動。城中間是晨畫的鐘塔，鐘面裡空了五格；時間大魔王（明）站在鐘塔底下低頭看懷錶。
     五個齒輪：兩個躺在路上；三個只在這一分鐘的某一下出現（水柱噴到最高、鳥飛過屋頂、葉子離開樹枝），要趁那時候點。錯過了，下一輪又會出現。
     撿到的齒輪進齒輪袋。點鐘面上空著的軸（或把袋裡的齒輪拖過去）放上去；放上去的角度是錯的，點一下轉四分之一齒、或按住拖著轉，轉到咬住旁邊那一個就「喀」一聲鎖住。
     鍵盤：Tab 選袋裡的齒輪或鐘面的軸，Enter 放上／轉，方向鍵左右轉。
     五個都咬住：鐘塔響一聲、指針往前走一格，整座城往前走（水落地、鳥飛出城、葉子停在路上、每一個鐘開始走，這些是明多做的），約 3.6 秒後送 larch:complete。不會失敗。
     協定：送 larch:ready → 收 larch:init（只存起來，本遊戲不讀變數）→ 完成時 larch:set → larch:complete。
     miniGameReadVars：（無）
     miniGameWriteVars：ch5GearsDone（true）
     result：ticking，payload：{}
     直接開這個檔（不在 Larch 裡）也能玩；?still=1 模擬 prefers-reduced-motion；?fast=1 把一分鐘縮短（測試用）。 -->

  function upH() { s.g.removeEventListener('pointermove', mv); s.g.removeEventListener('pointerup', upH); s.g.removeEventListener('pointercancel', upH); s.g.classList.remove('dragging');
    if (s.locked) return;

  s.g.addEventListener('pointermove', mv); s.g.addEventListener('pointerup', upH); s.g.addEventListener('pointercancel', upH); }
function slotKey(s, ev) { if (!started || finished) return;

  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { ev.preventDefault(); turn(s, -1); } }

// ===== 停太久：提示下一步 =====
var idleT = null;
function idleReset() { clearTimeout(idleT); clearNudge(); idleT = setTimeout(nudge, 8000); }
function clearNudge() { PICKS.forEach(function (p) { p.ring.classList.remove('on'); }); for (var k in C.spots) C.spots[k].classList.remove('on'); SLOTS.forEach(function (s) { s.g.classList.remove('want2'); }); }
function nudge() { if (finished) return; clearNudge();
  var unl = SLOTS.filter(function (s) { return s.placed && !s.locked; })[0];
  if (unl) hint('放上去的齒輪還沒咬住。點它轉一點，轉到齒對著齒縫。');
  else if (POCKETS.some(function (q) { return q.classList.contains('full'); })) { hint('袋裡有齒輪。點鐘面上空著的軸，放上去。'); wantSlots(); }
  else { var road = PICKS.filter(function (p) { return p.road && !p.got; });
    if (road.length) { road.forEach(function (p) { p.ring.classList.add('on'); }); hint('路上還有齒輪，點它撿起來。'); }
    else { var tm = PICKS.filter(function (p) { return p.win && !p.got; })[0]; if (tm) { C.spots[tm.id].classList.add('on'); hint(tm.hint); } } }
  idleT = setTimeout(nudge, 10000); }

// ===== 全部咬住：時間走起來 =====
var endStart = 0, endFrom = null, ticks = 0, tickT = null;
function finish() { finished = true; clearTimeout(idleT); clearNudge(); clearInterval(walkT); walkT = 0; if (C.heroFlip) C.heroFlip.removeAttribute('transform'); setPose('hero', 'watch'); setPose('boss', 'smile'); PICKS.forEach(function (p) { p.el.classList.remove('on'); });
  var t = phase(performance.now());
  endFrom = { h: waterH(t), f: waterFrame(t), b: birdAt(t), l: leafAt(t) };
  setTimeout(function () {
    SND.bell(); SND.start(); hint('時間走起來了。'); C.pulse.classList.add('on'); $('faceF').classList.add('running');
    stopped = true; endStart = performance.now();
    // 指針往前走一格

    [C.fm].concat(CLOCKS.map(function (c) { return c.mh; })).forEach(function (h) { h.style.transition = still ? 'none' : 'transform .45s cubic-bezier(.3,1.8,.5,1)'; h.style.transform = 'rotate(' + (TIME.m + 1) * 6 + 'deg)'; });
    setTimeout(function () { if (!still) SND.splash(); }, 650);
    var s = TIME.s; tickT = setInterval(function () { s++; ticks++; SND.tick(ticks);
      CLOCKS.concat([{ sh: C.fs }]).forEach(function (c) { c.sh.style.transition = still ? 'none' : 'transform .18s cubic-bezier(.3,1.8,.5,1)'; c.sh.style.transform = 'rotate(' + s * 6 + 'deg)'; }); }, 1000);
  }, still ? 200 : 500);
  LARCH.set('ch5GearsDone', true);
  setTimeout(function () { LARCH.done('ticking', {}); }, still ? 3200 : 4100); }
function endAnim(now) {
  var k = (now - endStart) / 1000;
  // 主齒輪與五個齒輪一起轉
  theta0 += (still ? 0 : .012); drawMech();
  if (still) { // 減少動態：直接換成「往前走之後」的樣子，淡淡帶過
    showWaterMix(waterMix(phase(now)), now);
    C.bird.setAttribute('opacity', Math.max(0, 1 - k * 2));
    C.leaf.setAttribute('transform', 'translate(530,526) rotate(80)');
    return; }
  showWaterMix(waterMix(phase(now)), now);   // 時間走起來之後水照樣一直噴
  // 鳥飛過屋頂，飛到城外
  var bk = Math.min(1, k / 2.4), b0 = endFrom.b, bx = b0.x + (900 - b0.x) * bk, by = b0.y - 150 * bk * bk + Math.sin(bk * Math.PI) * -20;
  C.bird.setAttribute('opacity', bk < 1 ? 1 : 0); C.bird.setAttribute('transform', 'translate(' + bx.toFixed(1) + ',' + by.toFixed(1) + ') rotate(' + (-18 * bk) + ')');
  showBird(true, now);
  // 葉子掉到石板路上，停住
  var lk = Math.min(1, k / 1.6), l0 = endFrom.l, lx = l0.x + (530 - l0.x) * lk + Math.sin(lk * 8) * 12 * (1 - lk), ly = l0.y + (526 - l0.y) * lk * lk, lr = l0.r + (80 - l0.r) * lk + Math.sin(lk * 8) * 30 * (1 - lk);
  C.leaf.setAttribute('transform', 'translate(' + lx.toFixed(1) + ',' + ly.toFixed(1) + ') rotate(' + lr.toFixed(1) + ')');
}

// ===== 開始 =====
function layout() { var st = $('stage'), a = st.getBoundingClientRect(), tall = a.width / Math.max(1, a.height) < 1.05; st.classList.toggle('tall', tall);
  var cw, ch, fs, bagH = 62, gap = tall ? 10 : 16;
  if (tall) { cw = Math.min(a.width, (a.height - bagH - gap * 2) * .55 / .7); ch = cw * .7; fs = Math.min(a.width - 20, a.height - ch - bagH - gap * 2); }
  else { cw = Math.min((a.width - gap) * .6, a.height / .7); ch = cw * .7; fs = Math.min(a.width - cw - gap - 10, a.height - bagH - gap); cw = Math.min(cw, a.width - fs - gap - 10); ch = cw * .7; }
  $('cityF').style.width = Math.floor(cw) + 'px'; $('cityF').style.height = Math.floor(ch) + 'px';
  $('faceF').style.width = $('faceF').style.height = Math.floor(Math.max(180, fs)) + 'px'; }
function boot() { if (booted) return; booted = true;
  if (still) document.documentElement.classList.add('reduce');
  document.body.classList.add('on'); buildCity(); buildFace(); buildBag(); layout(); addEventListener('resize', layout);
  t0 = performance.now(); requestAnimationFrame(frame); $('go').focus(); window.PageLoading?.finish(); }
$('go').addEventListener('click', function () { SND.unlock(); started = true; $('intro').classList.add('gone'); idleReset(); SND.appear(); });
$('mute').addEventListener('click', function () { var m = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', m); this.textContent = m ? '聲音 關' : '聲音 開'; SND.setMute(m); });
// 測試用鉤子（不影響遊戲）

  return { heroPose: poses.heroPose, bossPose: poses.bossPose, phase: t, period: PERIOD, got: PICKS.filter(function (p) { return p.got; }).map(function (p) { return p.id; }),
