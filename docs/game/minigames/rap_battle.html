<title>音之國．說唱對決</title>
<!-- 新版第四章〈音之國（預演）〉小遊戲：說唱對決。對應 新版/劇本/第四章.md 第五節的【小遊戲 說唱對決】、設計.md 第四章定稿第 7 條。
     背景用已定稿的音之國舞台圖；說唱大魔王（詩）與勇者疊在舞台上。
     只玩兩回合（2026-11-16 作者試玩後改）。開始後打拍子（90 BPM，大鼓、小鼓、hi-hat；接對一次多一層貝斯、再一次多一層和弦）。魔王那句隨拍子逐字亮起，接著跳出三張句子卡，
     玩家挑句尾押同一個韻的那句（點、或鍵盤 1／2／3、方向鍵＋Enter）。接對：句子隨拍子亮、韻腳字發金光並標出三句的韻。
     第一回合接對：照劇本「帽子歪一點」，換成帽子歪到一邊、一臉錯愕的站姿立繪 img/shi_hattilt.png（同一個框），順勢震一下。第二回合接對的那一下：魔王換成完敗立繪
     （img/shi_defeat.png：跌坐、帽子掉在地上、麥克風脫手滾到旁邊），落下並震一下，停一拍後拍子淡出、送 larch:complete。
     錯的句子句首都是「……」，句尾不押韻（也不押上一回合的韻）；正解的位置每次出卡都重新打亂。
     接錯：那張卡搖一下變暗、標出它的韻，魔王押韻吐槽一句，再挑，不會失敗。
     最後一回合（魔王唱「最後一回合別逞強……」、她沒有接）不在小遊戲裡，交給劇本小遊戲之後的對話卡。
     協定：送 larch:ready → 收 larch:init（只存起來，本遊戲不讀變數）→ 完成時 larch:set → larch:complete。
     miniGameReadVars：（無）
     miniGameWriteVars：ch4RapDone（true）
     result：rapped，payload：{ misses }（接錯的次數）
     直接開這個檔（不在 Larch 裡）也能玩；?still=1 模擬 prefers-reduced-motion；?fast=1 拍子加快一倍（自動測試用）。 -->
