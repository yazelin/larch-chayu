<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>色之國．上色</title>
<!--
  第三章「上色」：彩色定稿街景下方是原圖，上方 canvas 以灰階層和噴漆遮罩顯色。
  按住拖曳噴灑；同一處停留太久會積墨糊掉，鬆開後再噴一次即可洗開。
  城裡藏 13 個會回應的地方（WAKE）：噴到那一點就醒過來（花開、蝴蝶飛、燈亮、居民探頭揮手、貓跳上花箱、鳥飛走），
  右上的收集欄亮一格；素材都是 AI 畫的水彩紙片（img/wake_*.webp）。
  晨（彩色大魔王）偶爾揮披風，把一小塊剛噴好的地方吹回灰色（gust），追過去噴回來就好；他的表情隨顏色變多從得意變動搖，完成時認輸。
  全部喚醒＋覆蓋率 75% 時，剩餘灰色在兩秒內以潑墨擴散補滿。晨的披風保持灰色。不會失敗、沒有計時。
  鍵盤：方向鍵移動噴嘴，按住空白鍵噴灑。聲音由 Web Audio 合成，沿用聲音開關。
  協定：送 larch:ready → 收 larch:init → 完成時 larch:set → larch:complete。
  miniGameReadVars：（無）
  miniGameWriteVars：ch3ColorDone（true）、ch3Smudge（積墨糊掉次數）
  result：colored，payload：{ smudges }
  直接開檔也能玩；?still=1 模擬減少動態。
-->
<style>
:root { color-scheme:light; --ink:#3b2f2c; --dim:#6e5a52; --gold:#b8862f; --gold-dim:rgba(184,134,47,.38); --paper:#f3ecdf; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
body { color:var(--ink); font-family:"Iansui","LXGW WenKai TC","Kaiti TC","BiauKai",serif; background:radial-gradient(70vmax 45vmax at 18% 6%,rgba(255,214,150,.55),transparent 60%),radial-gradient(120vmax 80vmax at 50% 55%,#e9dfcc,#cbbda6 70%,#9c8f80); }
body::before { content:""; position:fixed; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.4; background-image:radial-gradient(1px 1px at 12% 18%,#79675855,transparent),radial-gradient(1px 1px at 33% 7%,#79675844,transparent),radial-gradient(1.5px 1.5px at 71% 12%,#79675844,transparent),radial-gradient(1px 1px at 86% 31%,#79675833,transparent); }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
.app { position:fixed; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:10px; padding:max(2vh,10px) max(1.5vw,10px) max(1.5vh,10px); opacity:0; transition:opacity .5s; }
body.on .app { opacity:1; }
.bar { display:flex; align-items:center; gap:12px; min-width:0; }
.kicker { margin:0; font-size:clamp(12px,1vw,14px); letter-spacing:.42em; color:var(--gold); white-space:nowrap; }
.rule { flex:1; height:1px; background:linear-gradient(90deg,var(--gold-dim),transparent); }
.count { font-size:clamp(13px,1.15vw,16px); letter-spacing:.12em; white-space:nowrap; }
.count b { color:var(--gold); font-weight:400; font-variant-numeric:tabular-nums; }
.mute { position:relative; isolation:isolate; padding:4px 12px; border:0; background:none; font-size:13px; letter-spacing:.12em; white-space:nowrap; }
.mute::before { content:""; position:absolute; inset:-1px; z-index:-1; border-radius:40%; background:var(--paper); box-shadow:inset 0 0 10px rgba(150,118,92,.32),0 6px 14px -10px rgba(60,40,30,.45); }
.stage { position:relative; display:grid; place-items:center; min-width:0; min-height:0; }
.frame { position:relative; width:100%; aspect-ratio:1024 / 683; padding:6px; overflow:hidden; touch-action:none; border-radius:12px; isolation:isolate; background:var(--paper); box-shadow:inset 0 0 18px rgba(150,118,92,.45),0 14px 26px -14px rgba(60,40,30,.55); }
.frame::before { content:""; position:absolute; inset:0; z-index:7; pointer-events:none; border:1px solid rgba(120,92,70,.3); border-radius:10px; box-shadow:inset 0 0 14px rgba(150,118,92,.3); }
#colorScene,#grayLayer,#mudLayer,#fxLayer,#characterLayer { position:absolute; inset:6px; display:block; width:calc(100% - 12px); height:calc(100% - 12px); }
#colorScene { z-index:1; object-fit:fill; pointer-events:none; }
#grayLayer { z-index:2; pointer-events:auto; }
#mudLayer { z-index:3; pointer-events:none; }
#fxLayer { z-index:4; pointer-events:none; }
#characterLayer { z-index:5; overflow:visible; pointer-events:none; }
#nozzle { position:absolute; z-index:6; width:64px; height:64px; border:1px dashed rgba(167,95,61,.6); border-radius:48% 52% 59% 41% / 45% 42% 58% 55%; transform:translate(-50%,-50%); pointer-events:none; opacity:0; background:radial-gradient(circle,rgba(228,139,95,.16),rgba(223,156,109,.04) 58%,transparent 72%); transition:opacity .12s; }
#nozzle.visible { opacity:.72; }
#nozzle.spraying { opacity:.95; width:82px; height:82px; border-color:rgba(177,89,55,.72); background:radial-gradient(circle,rgba(236,152,91,.25),rgba(221,133,88,.08) 58%,transparent 74%); }
.hint { min-height:1.8em; margin:0; text-align:center; text-wrap:balance; font-size:clamp(14px,1.25vw,18px); letter-spacing:.12em; line-height:1.7; color:#4d3d37; transition:opacity .3s; }
.hint.fade { opacity:0; }
.intro { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:rgba(233,223,208,.42); backdrop-filter:blur(1px); transition:opacity .45s; }
.intro.gone { opacity:0; pointer-events:none; }
.card { position:relative; isolation:isolate; width:min(460px,88vw); padding:26px 30px 24px; text-align:center; }
.card::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:8px; background:var(--paper); box-shadow:inset 0 0 18px rgba(150,118,92,.45),inset 0 0 3px rgba(120,92,70,.55),0 14px 26px -14px rgba(60,40,30,.55); }
.card small { display:block; color:var(--gold); font-size:13px; letter-spacing:.5em; }
.card h1 { margin:8px 0 0; font-size:clamp(24px,2.6vw,32px); font-weight:400; letter-spacing:.4em; text-indent:.4em; }
.card .rule { display:block; width:60%; height:1px; margin:14px auto 16px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
.card p { margin:0 0 8px; color:var(--dim); font-size:15px; line-height:1.8; letter-spacing:.06em; text-align:left; }
.go { position:relative; isolation:isolate; margin-top:12px; padding:10px 34px 10px 40px; border:0; border-radius:22px; background:none; font-size:18px; letter-spacing:.4em; }
.go::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:40%; background:rgba(233,207,154,.92); box-shadow:0 4px 10px -8px #765; }
.go:hover { filter:brightness(1.04); } .go:active { transform:scale(.97); }
@media (orientation:portrait) {
  .app { gap:8px; padding:max(3vh,12px) max(3vw,10px); }
  .bar { gap:8px; }
  .kicker { letter-spacing:.25em; }
  .count { letter-spacing:.04em; }
  .frame { width:100%; }
  .hint { font-size:14px; letter-spacing:.04em; }
  .card { padding:22px 24px; }
}
.reduce #nozzle { transition:none !important; }
.frame { width:auto; }
.app { grid-template-rows:auto auto minmax(0,1fr) auto; }
.app > .bar { grid-row:1; } #collectTall { grid-row:2; } .app > .stage { grid-row:3; } .app > .hint { grid-row:4; }
.collect[hidden] { display:none !important; }
#wakeLayer { position:absolute; inset:6px; z-index:4; pointer-events:none; overflow:hidden; border-radius:4px; }
#wakeLayer img, #wakeLayer .clip { position:absolute; display:block; pointer-events:none; }
#wakeLayer img { user-select:none; -webkit-user-drag:none; }
#wakeLayer .clip { overflow:hidden; }
#wakeLayer .clip img { left:0; bottom:0; width:100%; }
#bossImg { transition:opacity .25s; }
.heroPose { opacity:0; transition:opacity .28s ease; }
.heroPose.on { opacity:1; }
.reduce .heroPose { transition:none !important; }
.collect { display:flex; align-items:center; gap:4px; flex-wrap:nowrap; }
.collect .cell { position:relative; isolation:isolate; width:clamp(20px,2.1vw,28px); height:clamp(20px,2.1vw,28px); display:grid; place-items:center; }
.collect .cell::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:38% 46% 40% 52% / 48% 40% 54% 42%; background:rgba(243,236,223,.7); box-shadow:inset 0 0 6px rgba(150,118,92,.45); transition:background .4s, box-shadow .4s; }
.collect .cell img { width:86%; height:86%; object-fit:contain; opacity:0; transform:scale(.4); transition:opacity .35s, transform .45s cubic-bezier(.3,1.6,.5,1); }
.collect .cell.on::before { background:#fbf3e2; box-shadow:inset 0 0 6px rgba(184,134,47,.55), 0 0 10px rgba(244,190,112,.65); }
.collect .cell.on img { opacity:1; transform:scale(1); }
.reduce .collect .cell img { transition:opacity .2s; transform:none; }
.collect .tally { margin-left:6px; font-size:clamp(12px,1vw,14px); letter-spacing:.08em; white-space:nowrap; color:var(--dim); }
.collect .tally b { color:var(--gold); font-weight:400; font-variant-numeric:tabular-nums; }
@media (orientation:portrait) {
  .collect { justify-content:center; flex-wrap:wrap; }
  .bar .count { font-size:12px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><p class="kicker">第三章．色之國</p><i class="rule"></i><div class="collect" id="collect" role="status" aria-label="醒過來的地方"></div><span class="count" id="count">顯色 <b id="coverage">0%</b></span><button class="mute" id="mute" aria-pressed="false">聲音 開</button></header>
  <div class="collect" id="collectTall" aria-hidden="true" hidden></div>
  <main class="stage"><div class="frame" id="frame">
    <img id="colorScene" src="./img/color_city.webp" alt="色之國的黃昏街景" draggable="false">
    <canvas id="grayLayer" aria-hidden="true"></canvas>
    <canvas id="mudLayer" aria-hidden="true"></canvas>
    <canvas id="fxLayer" aria-hidden="true"></canvas>
    <div id="wakeLayer" aria-hidden="true"></div>
    <svg id="characterLayer" viewBox="0 0 1024 683" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs><filter id="softInk"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.2"/><feGaussianBlur stdDeviation=".35"/></filter></defs>
      <!-- 勇者隨進度換姿勢（作者 11-17：要自然、隨進度換）：瞄準（預設）→ 噴灑（按住時）→ 開心（叫醒一處或噴回吹灰處，1.8 秒）→ 抬頭看城（完成）。
           四張排在同一畫布（900×1150、站直身高 1100、兩腳中心在下緣中間，canon_new/outfits/poses/normalize.py），同一個框疊放，換圖交叉淡入、腳底不跳位；身高與腳底對齊原本的 hero.png。 -->
      <g id="heroCharacterWrap"><image class="heroPose on" id="hero_aim" href="./img/hero_coloring_aim.webp" x="304.4" y="223.7" width="251.2" height="320.9" preserveAspectRatio="xMidYMax meet"/><image class="heroPose" id="hero_spray" href="./img/hero_coloring_spray.webp" x="304.4" y="223.7" width="251.2" height="320.9" preserveAspectRatio="xMidYMax meet"/><image class="heroPose" id="hero_happy" href="./img/hero_coloring_happy.webp" x="304.4" y="223.7" width="251.2" height="320.9" preserveAspectRatio="xMidYMax meet"/><image class="heroPose" id="hero_done" href="./img/hero_coloring_done.webp" x="304.4" y="223.7" width="251.2" height="320.9" preserveAspectRatio="xMidYMax meet"/></g>
      <g id="bossCharacter">
        <!-- 晨的披風照劇本保持灰色：每張表情都是 AI 從定稿重畫的「只有披風是灰的」立繪（作者 11-16：用 AI 重繪，不要用改圖）；
             得意 → 揮披風 → 動搖 → 認輸，位置與大小在 BOSS -->
        <image id="bossImg" href="./img/chen_smug.webp" x="524.4" y="156" width="161.6" height="404" preserveAspectRatio="xMidYMax meet"/>
      </g>
    </svg>
    <div id="nozzle" aria-hidden="true"></div>
  </div></main>
  <p class="hint" id="hint">按住拖曳，把黃昏的顏色噴回城裡。噴到的地方會醒過來。</p>
</div>
<div class="intro" id="intro"><div class="card">
  <small>色之國（預演）</small><h1>上色</h1><i class="rule"></i>
  <p>這座城的顏色不見了。按住拖曳，像噴漆一樣把黃昏的顏色噴回去。</p>
  <p>城裡藏著十三個會醒過來的地方：花台、蝴蝶、路燈、窗裡的人、貓、屋頂的鳥……噴到它，它就活過來，上面的小格亮一格。</p>
  <p>彩色大魔王偶爾揮一下披風，把剛噴好的地方吹回灰色，追過去噴回來就好。全部叫醒、顏色噴到大半，整座城就回來了。</p>
  <button class="go" id="go">開始上色</button>
</div></div>
<script>
'use strict';
var SCENE_W=1024, SCENE_H=683, COVER_THRESHOLD=.75;
var $=function(id){return document.getElementById(id);};
var colorScene=$('colorScene'), grayLayer=$('grayLayer'), mudLayer=$('mudLayer'), fxLayer=$('fxLayer'), frame=$('frame'), nozzle=$('nozzle');
var graySource=document.createElement('canvas'); graySource.width=SCENE_W; graySource.height=SCENE_H;
var maskCanvas=document.createElement('canvas'), fillCanvas=document.createElement('canvas');
var maskCtx=null, fillCtx=null, grayCtx=grayLayer.getContext('2d'), mudCtx=mudLayer.getContext('2d'), fxCtx=fxLayer.getContext('2d');
var coverageCanvas=document.createElement('canvas'); coverageCanvas.width=128; coverageCanvas.height=86;
var coverageCtx=coverageCanvas.getContext('2d',{willReadFrequently:true});
var grayReady=false, started=false, filling=false, finished=false, booted=false, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]still=1/.test(location.search);
var coverage=0, coverageGrid=null, smudges=0, mudPuddles=[], particles=[], highlight=null, animationId=0, lastFxTime=0, lastMeasure=0;
var pointerSpray=false, keyboardSpray=false, activePointer=null, lastPoint=null, stationaryAnchor=null, stationaryTimer=0, smudgedThisPress=false, lastSoundCoverage=null, lastSoundCoverageAt=0, idleTimer=0, lastInput=0, hintTimer=0, phase='intro';
var keyboardPoint={x:SCENE_W/2,y:SCENE_H/2};

var LARCH={v:{},inited:false,set:function(name,value){try{parent.postMessage({type:'larch:set',name:name,value:value},'*');}catch(e){}},done:function(result,payload){window.__complete={result:result,payload:payload||{}};try{parent.postMessage({type:'larch:complete',result:result,payload:payload||{}},'*');}catch(e){}}};
addEventListener('message',function(ev){var d=ev.data||{};if(d.type==='larch:init'){LARCH.v=d.variables||{};LARCH.inited=true;boot();}});
try{parent.postMessage({type:'larch:ready'},'*');}catch(e){}

var SND=(function(){
  var ac=null,master=null,noiseSource=null,sprayGain=null,sprayBuffer=null,muted=false,lastSparkAt=0,notes=[523.25,587.33,659.25,783.99,880];
  function context(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=muted?0:.52;master.connect(ac.destination);}if(ac.state==='suspended')ac.resume();return ac;}
  function pinkNoiseBuffer(a){
    var length=a.sampleRate*2,b=a.createBuffer(1,length,a.sampleRate),d=b.getChannelData(0),rows=new Float32Array(16),sum=0,square=0;
    for(var band=0;band<rows.length;band++)rows[band]=Math.random()*2-1;
    for(var i=0;i<length;i++){if(i>0){var n=i,octave=0;while((n&1)===0&&octave<15){octave++;n>>=1;}rows[octave]=Math.random()*2-1;}var pink=0;for(var j=0;j<rows.length;j++)pink+=rows[j];pink/=rows.length;d[i]=pink;sum+=pink;square+=pink*pink;}
    var mean=sum/length,rms=Math.sqrt(square/length-mean*mean)||1,scale=.62/rms;for(var k=0;k<length;k++)d[k]=(d[k]-mean)*scale;
    return b;
  }
  function startSpray(){var a=context();if(!a||noiseSource)return;if(!sprayBuffer)sprayBuffer=pinkNoiseBuffer(a);noiseSource=a.createBufferSource();noiseSource.buffer=sprayBuffer;noiseSource.loop=true;var low=a.createBiquadFilter(),band=a.createBiquadFilter();low.type='lowpass';low.frequency.value=2400;low.Q.value=.62;band.type='bandpass';band.frequency.value=1120;band.Q.value=.58;sprayGain=a.createGain();sprayGain.gain.setValueAtTime(0,a.currentTime);sprayGain.gain.linearRampToValueAtTime(.075,a.currentTime+.16);noiseSource.connect(low);low.connect(band);band.connect(sprayGain);sprayGain.connect(master);noiseSource.start();}
  function stopSpray(){if(!noiseSource)return;var source=noiseSource,a=ac;try{sprayGain.gain.cancelScheduledValues(a.currentTime);sprayGain.gain.setValueAtTime(sprayGain.gain.value,a.currentTime);sprayGain.gain.linearRampToValueAtTime(0,a.currentTime+.15);source.stop(a.currentTime+.18);}catch(e){}noiseSource=null;sprayGain=null;}
  function bell(a,frequency,position,level,delay){var t=a.currentTime+(delay||0),voice=a.createGain(),pan=typeof a.createStereoPanner==='function'?a.createStereoPanner():null,partials=[1,2.76,5.4],weights=[1,.25,.08];voice.gain.setValueAtTime(.0001,t);voice.gain.linearRampToValueAtTime(.038*level,t+.012);voice.gain.exponentialRampToValueAtTime(.0001,t+.62);if(pan){pan.pan.setValueAtTime(Math.max(-.38,Math.min(.38,(position-.5)*.76)),t);voice.connect(pan);pan.connect(master);}else voice.connect(master);for(var i=0;i<partials.length;i++){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(frequency*partials[i],t);g.gain.value=weights[i];o.connect(g);g.connect(voice);o.start(t);o.stop(t+.64);}}
  function color(x,speed,newArea){if(newArea<.00065||!isFinite(newArea))return;var a=context(),now=performance.now();if(!a||now-lastSparkAt<190)return;var chance=Math.min(.78,.25+Math.min(.3,speed*.035)+Math.min(.38,newArea*27));if(Math.random()>chance)return;lastSparkAt=now;var index=Math.min(4,Math.max(0,Math.round(x*4))),frequency=notes[index]*(.97+x*.06)*(1+Math.min(.025,speed*.012));bell(a,frequency,x,.62+Math.min(.35,newArea*20)+Math.min(.18,speed*.06),0);}
  function pop(){var a=context();if(!a)return;var o=a.createOscillator(),g=a.createGain(),low=a.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(122,a.currentTime);o.frequency.exponentialRampToValueAtTime(72,a.currentTime+.17);low.type='lowpass';low.frequency.value=360;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(.085,a.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.connect(low);low.connect(g);g.connect(master);o.start();o.stop(a.currentTime+.24);}
  function finale(){var a=context();if(!a)return;[261.63,329.63,392,523.25,659.25].forEach(function(f,i){bell(a,f,.5,.9,i*.15);});}
  // 喚醒：每一種用同一組五聲音階（C D E G A）排成不同的小句子；位置決定左右聲道
  var WAKE_TUNES={bloom:[[0,0],[2,.09],[4,.18]],butterfly:[[4,0],[3,.06],[4,.12],[5,.18]],lamp:[[0,0],[2,0],[4,.02]],person:[[3,0],[4,.14]],cat:[[2,0],[4,.1],[3,.24]],birds:[[5,0],[6,.05],[5,.1],[6,.15]],petals:[[6,0],[5,.07],[4,.14],[3,.21],[2,.28]]};
  var SCALE=[392,440,523.25,587.33,659.25,783.99,880,1046.5];
  function wake(kind,x){var a=context();if(!a)return;(WAKE_TUNES[kind]||WAKE_TUNES.bloom).forEach(function(n){bell(a,SCALE[n[0]],x,kind==='lamp'?.75:1,n[1]);});}
  function gust(){var a=context();if(!a)return;if(!sprayBuffer)sprayBuffer=pinkNoiseBuffer(a);var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=sprayBuffer;f.type='bandpass';f.Q.value=.9;f.frequency.setValueAtTime(380,t);f.frequency.linearRampToValueAtTime(1300,t+.45);f.frequency.linearRampToValueAtTime(520,t+1.1);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1.25);bell(a,329.63,.65,.5,.05);bell(a,293.66,.6,.45,.2);}
  return{unlock:context,startSpray:startSpray,stopSpray:stopSpray,color:color,pop:pop,finale:finale,wake:wake,gust:gust,setMute:function(v){muted=v;if(master)master.gain.setTargetAtTime(v?0:.52,ac.currentTime,.025);}};
})();

// ===== 版面：場景框照舞台大小等比放，不蓋到標題列與提示 =====

setTimeout(boot,parent===window?0:2000);
function sampleScene(x,y){var c=document.createElement('canvas');c.width=SCENE_W;c.height=SCENE_H;var ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(colorScene,0,0,SCENE_W,SCENE_H);ctx.drawImage(grayLayer,0,0,SCENE_W,SCENE_H);var p=ctx.getImageData(Math.round(x),Math.round(y),1,1).data;return[p[0],p[1],p[2],p[3]];}
function sampleGrayCape(x,y){var img=$('grayCapeImage'),c=document.createElement('canvas');c.width=280;c.height=960;var ctx=c.getContext('2d',{willReadFrequently:true});ctx.filter='grayscale(1)';ctx.drawImage(img,0,0,280,960);var p=ctx.getImageData(x,y,1,1).data;return[p[0],p[1],p[2],p[3]];}
function state(){return{layout:innerWidth>=innerHeight?'wide':'tall',heroPose:heroPose,coverage:coverage,threshold:COVER_THRESHOLD,smudges:smudges,mud:mudPuddles.some(function(p){return p.active;}),phase:phase,booted:booted,inited:LARCH.inited,maskWidth:maskCanvas.width,maskHeight:maskCanvas.height,highlight:!!highlight,
  woken:WAKE.filter(function(w){return w.woken;}).map(function(w){return w.id;}),asleep:WAKE.filter(function(w){return !w.woken;}).map(function(w){return w.id;}),wakeTotal:WAKE.length,cellsOn:document.querySelectorAll('#collect .cell.on').length,
  gusts:gustState.count,gustActive:!!gustState.active,spots:gustState.spots.map(function(p){return{x:p.x,y:p.y,radius:p.radius,before:p.before,restored:p.restored};}),
  gustConfig:{firstMs:GUST_RULES.firstMs,intervalMinMs:GUST_RULES.intervalMinMs,intervalMaxMs:GUST_RULES.intervalMaxMs,momentumForMax:GUST_RULES.momentumForMax,baseRadius:GUST_RULES.baseRadius,maxRadius:GUST_RULES.maxRadius},
  gustIntervals:gustState.intervals.slice(),gustDelays:gustState.attacks.map(function(a){return a.delay;}),gustAttacks:gustState.attacks.map(function(a){return{targets:a.targets,rate:a.rate,delay:a.delay,budget:a.budget};}),
  gustOrigin:{x:GUST_RULES.boss.x,y:GUST_RULES.boss.y},gustNextIn:Math.max(0,Math.round(gustState.next-performance.now())),gustRate:gustState.rate,coverageAfterGust:gustState.coverageAfterLast,
  mood:mood,bossSrc:$('bossImg').getAttribute('href'),sprites:document.querySelectorAll('#wakeLayer img').length};}
window.__state=state;window.__wake=WAKE;window.__forceGust=function(){gustState.next=0;return maybeGust(performance.now(),true);};window.__coverAt=coverAt;window.__sampleScene=sampleScene;window.__sampleCape=sampleGrayCape;window.__point=function(x,y){var r=grayLayer.getBoundingClientRect();return{x:r.left+x/SCENE_W*r.width,y:r.top+y/SCENE_H*r.height};};window.__coverageAt=function(x,y){var a=coverageGrid&&coverageGrid[Math.floor(y/SCENE_H*86)]&&coverageGrid[Math.floor(y/SCENE_H*86)][Math.floor(x/SCENE_W*128)];return a||0;};
</script>
