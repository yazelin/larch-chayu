.ckeys i{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.16)}
.ckeys small{font-size:12px;opacity:.8}
.hang{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:#ff3b30;margin:28px auto 0}
.hang svg{width:32px;height:32px;fill:#fff}
.hang-l{display:block;text-align:center;font-size:12px;opacity:.8;margin-top:6px}
.call-who[hidden]{display:none}
.shiline{position:absolute;left:24px;right:24px;top:380px;text-align:center;font-family:Iansui,var(--ui);font-size:20px;color:#f4eee6}
/* ---- 單卡版面：手機在畫面中央（電腦）／直式手機全螢幕 ---- */
.wcard{position:absolute;inset:0;overflow:hidden;background:#120f19}
.dwrap{position:absolute;left:50%;top:50%;width:440.8px;height:881.6px;margin:-440.8px 0 0 -220.4px;transform-origin:50% 50%;perspective:1200px}
.dwrap .device{left:0;top:0;transform:none;transform-origin:50% 50%}
.wcard.pmode .dwrap{width:393px;height:852px;margin:-426px 0 0 -196.5px}
.wcard .device{perspective:none}
.wreset[disabled]{opacity:.4;cursor:default}
.wreset:hover,.cc-hint:hover,.w1-start:hover,.w1-ext button:hover,.cam-shutter:hover{filter:brightness(1.1)}
.btn-dim{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cc-grip{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script>
/* 劇情手機動作卡的共用核心（由 gen.py 接在每張卡前面）。
   協定同其他小遊戲卡：載入送 larch:ready → 收 larch:init（這些卡不讀變數）→ 做完 larch:set 寫回 → larch:complete。
   直接開檔（不在 Larch 裡）也能玩。這些卡完全不放聲音：來電鈴聲由前一張卡的 Larch 配樂循環播，手機快門聲還沒選定。 */
(function () {
"use strict";
var A = window.ASSETS || {};
var CARD = null;
window.registerCard = function (c) { CARD = c; };
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var root = null, timers = [], finished = false, sent = false;

/* ---------- Larch 介面 ---------- */
var LARCH = { v: {}, on: false,
  set: function (n, v) { parent.postMessage({ type: "larch:set", name: n, value: v }, "*"); },
  done: function (r, p) { if (sent) return; sent = true; parent.postMessage({ type: "larch:complete", result: r, payload: p || {} }, "*"); window.__done = { result: r, payload: p || {} }; } };
addEventListener("message", function (e) { var d = e.data || {}; if (d.type === "larch:init") { LARCH.v = d.variables || {}; boot(); } });
parent.postMessage({ type: "larch:ready" }, "*");
setTimeout(boot, parent === window ? 150 : 1500);
function boot() { if (LARCH.on) return; LARCH.on = true; start(); }

/* ---------- 小工具 ---------- */
function pad(n) { return String(n).padStart(2, "0"); }
function cap(el, e) { try { el.setPointerCapture(e.pointerId); } catch (_) {} }
function localScale(el) { var r = el.getBoundingClientRect(); return r.width / el.offsetWidth || 1; }
function lp(el, e) { var s = localScale(el), r = el.getBoundingClientRect(); return [(e.clientX - r.left) / s, (e.clientY - r.top) / s]; }
function anim(el, frames, opt) { if (reduce || !el.animate) return { finished: Promise.resolve() }; return el.animate(frames, Object.assign({ duration: 380, easing: "cubic-bezier(.2,.9,.25,1)" }, opt || {})); }
function later(f, ms) { timers.push(setTimeout(f, reduce ? Math.min(ms, 60) : ms)); }
function fitDisp(el) { if (!el) return; var f = 84; el.style.fontSize = f + "px"; var max = el.parentNode.offsetWidth - 44; while (el.offsetWidth > max && f > 40) { f -= 4; el.style.fontSize = f + "px"; } }
function updateClock() { var d = new Date(), h = d.getHours(), m = pad(d.getMinutes()), h12 = (h % 12) || 12;
  document.querySelectorAll("[data-now]").forEach(function (e) { e.textContent = h12 + ":" + m; }); }
setInterval(updateClock, 30000);

/* ---------- 圖示 ---------- */
var ICON = {
  bell: '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  bellOff: '<svg viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>' };
var uidN = 0; function uid() { return "k" + (++uidN); }
function gloss(id) { return '<linearGradient id="' + id + 'gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".06"/></linearGradient>'; }
function bgGrad(id, a, b) { return '<linearGradient id="' + id + 'bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient>'; }
var ICONS = {
  draw: function () { return '<image href="' + A.icons.draw + '" width="100" height="100" preserveAspectRatio="xMidYMid slice"/>'; },
  compose: function () { return '<image href="' + A.icons.compose + '" width="100" height="100" preserveAspectRatio="xMidYMid slice"/>'; },
  code: function (id) { return '<defs>' + bgGrad(id, "#5b78a6", "#34507c") + gloss(id) + '<mask id="' + id + 'm"><rect width="20" height="20" fill="#fff"/><circle cx="12.828" cy="7.172" r="4.8" fill="#000"/></mask></defs><rect width="100" height="100" fill="url(#' + id + 'bg)"/><g transform="translate(50 50) scale(3.44) translate(-10 -10)"><circle cx="10" cy="10" r="8" fill="#fff" mask="url(#' + id + 'm)"/><circle cx="12.828" cy="7.172" r="4" fill="#fff" fill-opacity=".45"/></g><rect width="100" height="100" fill="url(#' + id + 'gl)"/>'; } };
function ico(kind, size) { var id = uid(); return '<span class="ico" style="width:' + size + 'px;height:' + size + 'px"><svg viewBox="0 0 100 100" aria-hidden="true">' + ICONS[kind](id) + '</svg></span>'; }
var TOOLS = {
  chen: { tool: "畫圖", ico: "draw", n: "晨", glow: "radial-gradient(80% 70% at 50% 40%,#eef5c8,#c4da7d 60%,#8eac4e)" },

  shi: { tool: "做音樂", ico: "compose", n: "詩", glow: "radial-gradient(80% 70% at 50% 40%,#e7a7b8,#a2506a 60%,#5c2236)" } };

/* ---------- 手機機身 ---------- */
function sbIcons(c) { return '<svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx=".9" fill="' + c + '"/><rect x="5" y="5.6" width="3.2" height="6.4" rx=".9" fill="' + c + '"/><rect x="10" y="3" width="3.2" height="9" rx=".9" fill="' + c + '"/><rect x="15" y="0" width="3.2" height="12" rx=".9" fill="' + c + '"/></svg>' +
  '<svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.5 10.5 0 0 0 8.5.6 10.5 10.5 0 0 0 1 3.6l1.2 1.2a8.8 8.8 0 0 1 6.3-2.5z" fill="' + c + '"/><path d="M8.5 5.6c1.5 0 2.9.6 3.9 1.5l1.2-1.2a7.2 7.2 0 0 0-10.2 0l1.2 1.2c1-.9 2.4-1.5 3.9-1.5z" fill="' + c + '"/><path d="M8.5 8.9c.6 0 1.2.2 1.6.6L8.5 11.2 6.9 9.5c.4-.4 1-.6 1.6-.6z" fill="' + c + '"/></svg>' +
  '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="' + c + '" stroke-opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2.4" fill="' + c + '"/><path d="M25 4.4v4.2c.8-.3 1.4-1.1 1.4-2.1s-.6-1.8-1.4-2.1z" fill="' + c + '" fill-opacity=".45"/></svg>'; }
function statusBar(dark) { var c = dark ? "#fff" : "#000"; return '<div class="island" aria-hidden="true"></div><div class="status" style="--sb:' + c + '"><time data-now>9:41</time><span class="icons" aria-label="訊號滿格、Wi-Fi、電量八成">' + sbIcons(c) + '</span></div>'; }
function deviceHTML(inner) { return '<div class="device"><div class="shell"></div><i class="btn" style="left:-3px;top:150px;height:30px"></i><i class="btn" style="left:-3px;top:210px;height:58px"></i><i class="btn" style="left:-3px;top:282px;height:58px"></i><i class="btn" style="right:-3px;top:236px;height:92px;background:linear-gradient(270deg,#9a85a3,#d9c6e4)"></i><div class="bezel"></div><div class="screen-wrap">' + inner + '</div></div>'; }

/* ---------- 版面 ---------- */
function fit() { if (!root) return; var W = innerWidth, H = innerHeight, port = W / H < 4 / 5; root.classList.toggle("pmode", port);
  var dw = document.getElementById("dwrap"); if (!dw) return;
  var k = port ? Math.min(W / 393, H / 852) : Math.min(H * 0.94 / 881.6, W * 0.92 / 440.8);
  dw.style.transform = "scale(" + k.toFixed(4) + ")"; }
addEventListener("resize", fit);

/* ---------- 一張卡的生命週期 ---------- */
function mount() {
  timers.forEach(clearTimeout); timers = []; finished = false;
  var dark = CARD.dark ? 1 : 0;
  root.innerHTML = '<img class="wbg" src="' + A.bg + '" alt=""><div class="wglow"></div><div class="dwrap" id="dwrap">' +
    deviceHTML('<div class="screen wscr" data-wscr="' + CARD.id + '">' + statusBar(dark) + '<div class="wv">' + CARD.content() + '</div><i class="homebar" data-homebar style="--hb:' + (dark ? "#fff" : "#000") + '"></i></div>') +
    '</div><div class="wfoot"><span class="wstat" data-wstat role="status">還沒完成：做完才會往下</span><button class="wreset" data-wreset type="button">重來</button></div>';
  root.querySelector("[data-wreset]").addEventListener("click", function () { if (!sent) mount(); });
  var scr = root.querySelector("[data-wscr]");
  fit(); updateClock();
  CARD.bind({ scr: scr, root: root, later: later, anim: anim, cap: cap, lp: lp, localScale: localScale, fitDisp: fitDisp, ICON: ICON, TOOLS: TOOLS, ico: ico, A: A, reduce: reduce,
    isDone: function () { return finished; },
    /* 做完：狀態列變綠、先把結果寫回，停 delay 毫秒讓玩家看完最後的畫面，再送 larch:complete（Larch 照 miniGameAutoContinue 往下一張卡） */
    done: function (o) { if (finished) return; finished = true; o = o || {};
      var s = root.querySelector("[data-wstat]"); s.classList.add("done"); s.textContent = "完成　→ 接下一張卡";
      root.querySelector("[data-wreset]").disabled = true;
      var w = o.write || {}; Object.keys(w).forEach(function (k) { LARCH.set(k, w[k]); });
      window.__finished = true;
      setTimeout(function () { LARCH.done(o.result, o.payload); }, reduce ? 60 : (o.delay == null ? 900 : o.delay)); } });
}
function start() { root = document.getElementById("card"); if (!CARD) return; document.title = CARD.title; mount(); }
window.__phone = { get card() { return CARD && CARD.id; }, get finished() { return finished; }, get sent() { return sent; } };
window.__shared = { LARCH: LARCH }; window.__tools = TOOLS; window.__ico = ico; window.__ICON = ICON;
})();

</script>
<script>
/* 計算機：只有一顆鍵能按（＋這週、或＝），其他鍵畫成樣子、變淡 */
var CALC_KEYS = ["AC", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", ".", "="];
function calcHTML(o) {
  var keys = CALC_KEYS.map(function (k) { var op = "÷×−+=".indexOf(k) >= 0;
    if (o.enabled === "add" && k === "+") return '<button class="ck op big" data-calc-add type="button">＋這週</button>';
    if (o.enabled === "add" && k === "=") return "";
    if (o.enabled === "eq" && k === "=") return '<button class="ck op" data-calc-eq type="button" aria-label="等於">=</button>';
    return '<span class="ck' + (op ? " op" : "AC±%".indexOf(k) >= 0 ? " fn" : "") + (k === "0" ? " zero" : "") + ' dim" aria-hidden="true">' + k + '</span>'; }).join("");
  return '<div class="calc">' + o.top + '<div class="calc-side">' + o.side + '</div><div class="calc-exp" data-calc-exp>' + (o.exp || "") + '</div><div class="calc-disp" data-calc-disp>' + o.disp + '</div><div class="calc-keys' + (o.enabled === "add" ? " w6" : "") + '">' + keys + '</div></div>'; }
function rowsHTML(rows, on) { return '<div class="calc-weeks">' + rows.map(function (w, i) { return '<div data-week="' + i + '"' + (on ? ' class="on"' : "") + '><span>' + w[0] + '</span><b>' + w[1].toLocaleString("en-US") + '</b></div>'; }).join("") + '</div>'; }
function fmt(n) { return n.toLocaleString("en-US"); }

/* W7 第七章第 28 天：畫面已經是「3,000 − 1,160」，只按一次「＝」，顯示 1,840。 */
registerCard({ id: "calc_left", title: "算生活費", dark: true,
  content: function () { return calcHTML({ enabled: "eq", top: rowsHTML([["明：這禮拜的生活費還剩", 1840]], true), side: "續訂一個人：30,000", exp: "3,000 − 1,160", disp: "1,160" }); },
  bind: function (c) { var scr = c.scr;
    scr.querySelector("[data-calc-eq]").addEventListener("click", function () { if (c.isDone()) return;
      scr.querySelector("[data-calc-exp]").textContent = "3,000 − 1,160 =";
      var d = scr.querySelector("[data-calc-disp]"); d.textContent = "1,840"; c.fitDisp(d);
      c.done({ write: { phoneLeft: 1840 }, result: 1840, delay: 1800 }); }); } });

</script>
