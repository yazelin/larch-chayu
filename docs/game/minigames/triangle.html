.p.on:hover .glow, .p.on:focus-visible .glow { opacity: 1; animation: none; }
@keyframes breathe { 50% { opacity: .6; } }
.back { mix-blend-mode: screen; opacity: 0; transition: opacity 1.2s ease; }
.p.on .back { opacity: .7; animation: breatheBack 4.2s ease-in-out infinite; }
.p.on.hov .back { opacity: 1; animation: none; }

.pp image { transition: opacity .25s ease; }
.pp .react { opacity: 0; }
.pp.hov .react, .picked .pp.chosen .react { opacity: 1; }

.p.on.hov .glow { opacity: 1; animation: none; }
@keyframes breatheBack { 50% { opacity: .5; } }
.shade { mix-blend-mode: multiply; opacity: 0; transition: opacity 1.2s ease; }
.p.off .shade, .picked .p:not(.chosen) .shade { opacity: 1; }

.hit { fill: transparent; }
.u.on .hit { cursor: pointer; }
.u.off { pointer-events: none; }
.u:focus { outline: none; }
.ring { fill: none; stroke: var(--paper); stroke-width: 3; stroke-dasharray: 3 9; stroke-linecap: round; opacity: 0; transition: opacity .3s; }
.u.on:focus-visible .ring { opacity: .9; }
.say { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 16px; }
#title { top: max(5vh, 18px); left: max(3.2vw, 16px); right: auto; padding: 0; writing-mode: vertical-rl; }

    (points.C.g[1] + points.M.g[1] + points.S.g[1]) / 3
  ], r: (points.C.r + points.S.r) / 2 };
  var scale = art.h / 1024;
  [['C', 'M'], ['M', 'S'], ['S', 'C']].forEach(function (pair) {
    var bothLit = state.lit[pair[0]] && state.lit[pair[1]];
    el('line', { class: 'edge', x1: points[pair[0]].g[0], y1: points[pair[0]].g[1], x2: points[pair[1]].g[0], y2: points[pair[1]].g[1],
      'stroke-width': 2.6 * scale, 'stroke-dasharray': (1.5 * scale) + ' ' + (11 * scale), opacity: bothLit ? .8 : .35, filter: 'url(#brush)' }, edges);
  });
  ['M', 'C', 'S', 'ALL'].forEach(function (key) {
    var point = key === 'ALL' ? all : points[key];
    var lit = state.lit[key];
    var effectGroup = el('g', { class: 'p ' + (lit ? 'on' : 'off'), 'data-k': key, id: 'fx' + key }, effects);
    var hitGroup = el('g', { class: 'u ' + (lit ? 'on' : 'off'), 'data-k': key, id: 'd' + key }, ui);
    if (key === 'ALL') {
      el('ellipse', { class: 'glow', cx: point.g[0], cy: point.g[1], rx: point.r * .95, ry: point.r * .3, fill: COL.ALL, filter: 'url(#bleed)' }, effectGroup);
      el('ellipse', { class: 'glow', cx: point.g[0], cy: point.g[1], rx: point.r * .4, ry: point.r * .12, fill: '#fffaf0', filter: 'url(#soft)' }, effectGroup);
      el('ellipse', { class: 'ring', cx: point.g[0], cy: point.g[1], rx: point.r, ry: point.r * .34 }, hitGroup);
      el('ellipse', { class: 'hit', cx: point.g[0], cy: point.g[1], rx: point.r * 1.1, ry: point.r * .45 }, hitGroup);
    } else {
      var box = point.box, cut = art.cut[key];
      el('ellipse', { class: 'shade', cx: box[0], cy: box[1], rx: box[2] * 1.3, ry: box[3] * .98, fill: '#2a2c55', 'fill-opacity': .42, filter: 'url(#soft)' }, effectGroup);
      el('ellipse', { class: 'back', cx: box[0], cy: box[1] - box[3] * .1, rx: box[2] * 1.12, ry: box[3] * .92, fill: COL[key], filter: 'url(#bleed)' }, effectGroup);
      el('ellipse', { class: 'glow', cx: point.g[0], cy: point.g[1], rx: point.r, ry: point.r * .3, fill: COL[key], filter: 'url(#bleed)' }, effectGroup);
      el('ellipse', { class: 'glow', cx: point.g[0], cy: point.g[1], rx: point.r * .45, ry: point.r * .13, fill: '#fff8e8', filter: 'url(#soft)' }, effectGroup);
      el('ellipse', { class: 'ring', cx: box[0], cy: box[1], rx: box[2], ry: box[3] }, hitGroup);
      el('ellipse', { class: 'hit', cx: box[0], cy: box[1], rx: box[2], ry: box[3] }, hitGroup);
      var personGroup = el('g', { class: 'pp', 'data-k': key, id: 'pp' + key, style: 'pointer-events:none' }, people);
      el('image', { class: 'stand', href: cut.src, x: cut.x, y: cut.y, width: cut.w, height: cut.h, 'data-k': key }, personGroup);
      var react = cut.react;
      if (react && lit) el('image', { class: 'react', href: react.src, x: react.x, y: react.y, width: react.w, height: react.h, 'data-k': key }, personGroup);
    }
    var fontSize = (key === 'ALL' ? 28 : 38) * scale;
    var namePoint = point.n || [point.g[0], point.g[1] + fontSize * .35];
    el('text', { class: 'name', x: namePoint[0], y: namePoint[1], fill: lit ? '#fff8ec' : '#d9d2e2', stroke: STROKE[key], 'stroke-width': 6 * scale, 'font-size': fontSize }, hitGroup).textContent = NAME[key];
    if (lit) {
      hitGroup.setAttribute('role', 'button'); hitGroup.setAttribute('tabindex', '0'); hitGroup.setAttribute('aria-label', NAME[key]);
      // 滑鼠、鍵盤：點一下就選。觸控（手機沒有 hover）：第一次點＝播反應、待確認，第二次點同一個才選；點別人就換成別人的反應。
      hitGroup.addEventListener('pointerdown', function (event) { state.pointer = event.pointerType; });
      hitGroup.addEventListener('click', function (event) {
        event.stopPropagation();
        if (state.pointer === 'touch' && state.pending !== key) { state.pending = key; applyReact(); return; }
        go(key);

      hitGroup.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); go(key); } });
      // 滑鼠移上去或鍵盤聚焦：背後的光變亮、人換成被看著時的反應（「三個人一起」＝三位可選的人一起）；移開換回。
      hitGroup.addEventListener('pointerenter', function (event) { if (event.pointerType === 'mouse' || event.pointerType === 'pen') { state.hover = key; applyReact(); } });
      hitGroup.addEventListener('pointerleave', function () { if (state.hover === key) { state.hover = null; applyReact(); } });
      hitGroup.addEventListener('focus', function () { if (state.pointer === 'touch') return; state.hover = key; applyReact(); });
      hitGroup.addEventListener('blur', function () { if (state.hover === key) { state.hover = null; applyReact(); } });

  document.getElementById('hintp').textContent = state.picked ? '她看向' + NAME[state.picked] + '。' : state.hint;
  applyReact();
}
// 誰顯示被看著時的反應：觸控待確認的優先，否則是滑鼠或鍵盤正指著的；「三個人一起」帶動三位可選的人。
function reactKeys(key) {
  if (!key) return [];
  return key === 'ALL' ? ['C', 'M', 'S'].filter(function (k) { return state.lit[k]; }) : [key];
}
var lastSnd = null;
function applyReact() {
  var active = state.picked ? null : (state.pending || state.hover);
  var keys = reactKeys(active);
  if (active && active !== lastSnd) SND.play('hover', keys.length ? keys : [active]);
  lastSnd = active;
  ['C', 'M', 'S', 'ALL'].forEach(function (k) {
    var on = keys.indexOf(k) >= 0 || active === k;
    var fx = document.getElementById('fx' + k), person = document.getElementById('pp' + k);
    if (fx) fx.classList.toggle('hov', on);
    if (person) person.classList.toggle('hov', on);
  });
  var confirm = document.getElementById('confirmp');
  confirm.textContent = state.pending && !state.picked ? '再點一次「' + NAME[state.pending] + '」確定' : '';
}
function go(key) {
  if (state.picked || !state.lit[key]) return;
  state.picked = key; state.pending = null;
  SND.play('pick', key === 'ALL' ? reactKeys(key) : [key]);
  document.getElementById('sv').classList.add('picked');
  var chosen = reactKeys(key).concat(key);  // 選「三個人一起」時三位可選的人也一起維持反應
  document.querySelectorAll('.p, .u, .pp').forEach(function (group) { group.classList.toggle('chosen', chosen.indexOf(group.dataset.k) >= 0); });
  applyReact();
  document.getElementById('hintp').textContent = '她看向' + NAME[key] + '。';
  var best = window.__bestAffRoute || 'C';
  LARCH.set('ch7Route', key); LARCH.set('bestAffRoute', best); LARCH.set('awardRoute', best);
  setTimeout(function () { LARCH.done(key, { ch7Route: key, bestAffRoute: best, awardRoute: best }); }, 1600);
}
window.__state = function () {
  var images = Array.prototype.slice.call(document.querySelectorAll('#art, #people image.stand'));
  var reacts = Array.prototype.slice.call(document.querySelectorAll('#people image.react'));
  var shown = {};
  document.querySelectorAll('#people .pp').forEach(function (group) {
    var react = group.querySelector('.react');
    shown[group.dataset.k] = react && getComputedStyle(react).opacity > .5 ? 'react' : 'stand';
  });
  return { booted: LARCH.on, inited: Object.keys(LARCH.v).length > 0, lit: Object.assign({}, state.lit), picked: state.picked,
    layout: state.layout, bestAffRoute: state.best, images: images.map(function (image) { return image.getAttribute('href'); }),
    reacts: reacts.map(function (image) { return image.getAttribute('href'); }), shown: shown, pending: state.pending,
    confirm: document.getElementById('confirmp').textContent,
    viewBox: document.getElementById('sv').getAttribute('viewBox').split(' ').map(Number) };
};
window.__screenPoint = function (key) {
  var node = document.querySelector('#d' + key + ' .hit');
  var box = node.getBBox(), point = document.getElementById('sv').createSVGPoint();
  point.x = box.x + box.width / 2; point.y = box.y + box.height / 2;
  var screen = point.matrixTransform(node.getScreenCTM());
  return { x: screen.x, y: screen.y };
};
})();
