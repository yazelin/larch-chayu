parent.postMessage({ type: 'larch:ready' }, '*');
setTimeout(boot, parent === window ? 150 : 1500);
function boot() { if (LARCH.on) return; LARCH.on = true; start(); window.PageLoading?.finish(); }
var LINES = [
  { k: 'C', who: '晨', col: 'var(--c)', t: '握劍的姿勢，我好像還是不太會。', reply: ['那下次我再教妳一次。'] },
  { k: 'M', who: '明', col: 'var(--m)', t: '明這個名字，你喜歡嗎？', reply: ['喜歡。', '早點睡。報告明天要寫。'] },
  { k: 'S', who: '詩', col: 'var(--s)', t: '那首歌，明天可以再放一次嗎。', reply: ['現在就可以放啊。', '好啦好啦。小聲一點的版本。'] } ];
var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id) { return document.getElementById(id); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, still ? Math.min(ms, 60) : ms); }); }
function row(L) { var b = document.createElement('div'); b.className = 'draft'; b.innerHTML = '<span class="dot" style="background:' + L.col + '"></span><span class="tx"></span>'; $('drafts').appendChild(b); return b; }
async function type(el, s) { var tx = el.querySelector('.tx'); tx.innerHTML = '<span class="caret"></span>';
  for (var i = 1; i <= s.length; i++) { tx.innerHTML = s.slice(0, i) + '<span class="caret"></span>'; if (s[i - 1].trim() && s[i - 1] !== '…') SND.play('key'); await wait(s[i - 1] === '…' ? 220 : 95); }
  await wait(900); tx.textContent = s; }
async function erase(el) { var tx = el.querySelector('.tx'), s = tx.textContent; el.classList.add('gone');
  for (var i = s.length - 1; i >= 0; i--) { tx.textContent = s.slice(0, i); SND.play('del'); await wait(55); } el.remove(); }
function bubble(cls, html) { var b = document.createElement('div'); b.className = 'bub ' + cls; b.innerHTML = html; $('log').appendChild(b); return b; }
SND.bindMute($('snd'));
var Q = new URLSearchParams(location.search);
var MODE = Q.get('mode') ?? '{{MODE}}'; if (MODE.indexOf('{{') === 0) MODE = 'pick';
var ERASE_TEXT = Q.get('text') ?? '半夜睡不著和 AI 聊天的我，也能夠獲得幸福嗎';
async function start() { if (MODE === 'erase') return startErase(); if (MODE === 'send') return startSend();
  $('hint').textContent = '打了一行，看了很久。';
  var rows = [];
  for (var i = 0; i < LINES.length; i++) { var r = row(LINES[i]); rows.push(r); await type(r, LINES[i].t); }
  $('hint').textContent = '留下一句送出去';
  rows.forEach(function (r, i) { r.classList.add('pick'); r.setAttribute('role', 'button'); r.tabIndex = 0;
    r.setAttribute('aria-label', '送出：' + LINES[i].t);
    r.onclick = function () { choose(i); }; r.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(i); } }; });
  if (rows[0]) rows[0].focus({ preventScroll: true });
  var chosen = false;
  async function choose(i) { if (chosen) return; chosen = true; $('hint').textContent = '　';
    rows.forEach(function (r) { r.classList.remove('pick'); r.onclick = null; r.removeAttribute('tabindex'); });
    await Promise.all(rows.filter(function (_, j) { return j !== i; }).map(erase));
    var L = LINES[i]; rows[i].remove();
    bubble('me', L.t); SND.play('send'); await wait(700);
    var rd = document.createElement('div'); rd.className = 'read'; rd.textContent = '已讀'; $('log').appendChild(rd);
    for (var k = 0; k < L.reply.length; k++) { await wait(1100); bubble('them', '<span class="who" style="color:' + L.col + '">' + L.who + '</span>' + L.reply[k]); }
    var key = 'aff' + L.k; LARCH.set(key, LARCH.num(key, 0) + 1); LARCH.set('ch2Msg', L.k);
    await wait(1800); LARCH.done(L.k, { ch2Msg: L.k }); }
}

// 第七章：只能刪、不能送（mode=erase）。字自己打出來，送出鈕是灰的；按住刪除一字一字退光，之後「正在輸入…」亮很久又消失。不寫變數。
async function startErase() {
  var t = document.querySelector('.time'); if (t) t.textContent = '凌晨 1:12';
  $('hint').textContent = '　';
  var L = { col: 'var(--gold)' }, r = row(L);
  await type(r, ERASE_TEXT);
  var tx = r.querySelector('.tx'), left = ERASE_TEXT;
  var bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<button type="button" class="send" disabled aria-disabled="true">送出</button><button type="button" class="del" aria-label="按住刪除">按住刪除</button>';
  $('drafts').parentNode.appendChild(bar);
  var del = bar.querySelector('.del'), timer = null, over = false;
  $('hint').textContent = '送不出去。';
  function step() { if (over) return; left = left.slice(0, -1); SND.play('del'); tx.innerHTML = left + '<span class="caret"></span>';
    if (!left.length) finish(); }
  function hold(e) { if (over) return; if (e) e.preventDefault(); del.classList.add('on'); step(); clearInterval(timer); timer = setInterval(step, still ? 40 : 130); }
  function release() { del.classList.remove('on'); clearInterval(timer); timer = null; }
  del.addEventListener('pointerdown', hold); ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (k) { del.addEventListener(k, release); });
  del.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Backspace') && !e.repeat) hold(e); else if (e.key === 'Enter' || e.key === ' ' || e.key === 'Backspace') { e.preventDefault(); step(); } });
  del.addEventListener('keyup', release);
  del.focus({ preventScroll: true });
  async function finish() { over = true; release(); del.disabled = true; r.remove(); $('hint').textContent = '　';
    await wait(900);
    var ty = document.createElement('div'); ty.className = 'typing'; ty.textContent = '正在輸入…'; $('log').appendChild(ty);
    await wait(4200); ty.classList.add('out'); await wait(1200); ty.remove();
    await wait(1400); LARCH.done('erased', {}); }
}

// 真結局一年後：同一句，這次送得出去（mode=send，作者 2026-11-22）。字自己打出來，送出鈕是亮的；按下送出，三個人各回一句「能」。不寫變數。
async function startSend() {
  var t = document.querySelector('.time'); if (t) t.textContent = '凌晨 0:12';
  $('hint').textContent = '　';
  var L = { col: 'var(--gold)' }, r = row(L);
  await type(r, ERASE_TEXT);
  var bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<button type="button" class="send" aria-label="送出">送出</button>';
  $('drafts').parentNode.appendChild(bar);
  var send = bar.querySelector('.send'), done = false;
  $('hint').textContent = '這次，送得出去。';
  send.focus({ preventScroll: true });
  send.addEventListener('click', async function () { if (done) return; done = true; send.disabled = true; $('hint').textContent = '　';
    r.remove(); bar.remove(); bubble('me', ERASE_TEXT); SND.play('send'); await wait(800);
    var rd = document.createElement('div'); rd.className = 'read'; rd.textContent = '已讀'; $('log').appendChild(rd);
    var R = [['明', 'var(--ming, #4a6fa5)', '能。'], ['晨', 'var(--chen, #8bb04a)', '能。'], ['詩', 'var(--shi, #a8324a)', '能啦！']];
    for (var k = 0; k < R.length; k++) { await wait(1200); bubble('them', '<span class="who" style="color:' + R[k][1] + '">' + R[k][0] + '</span>' + R[k][2]); }
    await wait(2200); LARCH.done('sent', {}); });
}

})();
</script>
<script>
/* 作者 11-16：大螢幕上手機框只佔中間一小塊。手機框照設計稿 900px 高排版，螢幕比 900 高時整支等比例放大到 94vh（直式手機全螢幕時不放大）。 */
(function () { function fit() { var p = document.querySelector('.phone'); if (!p) return;
  var H = document.documentElement.clientHeight || innerHeight, z = matchMedia('(max-aspect-ratio: 4/5)').matches ? 1 : Math.max(1, H * 0.94 / 900); p.style.zoom = z;
  if (z !== 1 || !matchMedia('(max-aspect-ratio: 4/5)').matches) { var r = p.getBoundingClientRect();   // 量實際大小：超出可用高度就按比例縮回（11-16 下緣露底）
    if (r.height > H * 0.96) p.style.zoom = z * H * 0.94 / r.height; } }
  addEventListener('resize', fit); fit(); })();
</script>
</html>
