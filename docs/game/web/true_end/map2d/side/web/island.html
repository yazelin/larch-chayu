<style>
.chapter-tip-screen,

.chapter-tip-screen {

           max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  overflow: hidden auto;
  border: 0;
  color: var(--ink);
  font: 15px/1.6 "Noto Sans TC", system-ui, sans-serif;
  text-align: left;

.chapter-tip-screen.leaving { opacity: 0; pointer-events: none; }
.loading-backdrop { display: none; }

}

}

  height: 58px;
  width: max-content;

}
.chapter-tip-screen .walker img {

  width: auto;
  max-width: none;

}

}

  align-items: center;

  width: min(100%, 442px);
  height: clamp(90px, 16vh, 120px);
}
.chapter-tip-screen .crew img {
  width: min(calc(clamp(90px, 16vh, 120px) * .78), calc((100% - 3 * clamp(8px, 2.4vw, 22px)) / 4));
  height: auto;
  aspect-ratio: 1;
  border: 3px solid var(--gold);
  border-radius: 50%;
  background: #fff;
  will-change: transform;
}
.chapter-tip-screen .sea {
  position: relative;
  width: min(560px, 86vw);
  height: clamp(110px, 22vh, 170px);
}
.chapter-tip-screen .sea img {
  position: absolute;
  left: 0;
  top: 0;
  width: auto;
  max-width: none;
  will-change: transform;
}
.chapter-tip-screen .tip {
  display: block;

}

  display: block;

}

  .chapter-tip-screen .route { margin-top: 72px; }
}
@media (prefers-reduced-motion: reduce) {

body:has(> #page-loading:not(.leaving)) > :not(#page-loading, .loading-backdrop) {

<script id="chapter-tips" type="application/json">[{"from":"第一章","text":"點右上角的手機就能打開。到「設定」可以把休息提醒改成 10、20、30 分鐘，也可以選不用提醒。"},{"from":"第一章","text":"休息提醒跳出來時，按「去存檔」會直接打開存檔畫面，存好再去休息。"},{"from":"第一章","text":"休息提醒會等這一段台詞或小遊戲告一段落才出現，可以安心看完。"},{"from":"第一章","text":"點右上角任何一顆愛心，就能看三個人各有幾點好感。愛心裝滿是 12 點。"},{"from":"第一章","text":"手機的「相簿」會收好劇情裡看過的圖，點開以後可以左右滑著看。"},{"from":"第一章","text":"手機的「音樂」會收集劇情裡聽過的歌，點歌名就能再聽一次。"},{"from":"第一章","text":"劇情裡收到和傳出去的訊息，都留在手機的「訊息」裡，想回頭看可以點進去。"},{"from":"第一章","text":"手機「設定」裡有「配對真實手機」。用自己的手機掃 QR Code，就能在手機上看收藏、聊天紀錄和好感。","needs":"phone_app"},{"from":"第二章","text":"手機「寫程式」裡有進度表，可以加上自己要做的事，做完點一下打勾。"},{"from":"第二章","text":"自由時間走到晨、明、詩旁邊點他們，就能一對一聊天。走到長桌可以四個人一起聊。"},{"from":"第二章","text":"想知道今天還能聊幾句、畫幾張，打開明的電腦按「說明」就看得到。"},{"from":"第二章","text":"點晨的畫架，選「請晨畫一張」，寫下想看的畫面，晨就會幫妳畫。"},{"from":"第二章","text":"想讓晨回妳一張畫：先在「我來畫」自己畫一張，按「讓晨看看」，再按「請晨也畫一張」。"},{"from":"第二章","text":"晨看完妳的畫會幫它取一個名字，這張畫會收進畫架展廳。"},{"from":"第二章","text":"請晨畫圖、請詩做歌送出以後，可以先去逛別的地方，做好了會通知妳。"},{"from":"第二章","text":"每一章陪晨在畫板畫一筆、在明的進度表排一項、聽一首詩的歌，三個人的好感都會加 1 點，每章每人一次。"},{"from":"第二章","text":"詩的唱片架放著劇情裡聽過的歌，挑一張就能邊聽邊看歌詞。"},{"from":"第二章","text":"電子琴和吉他都彈得出聲音，用電腦鍵盤也可以彈。"},{"from":"第二章","text":"工作室圓鐘底下的小窗，會顯示試用期還剩幾天。"},{"from":"第二章","text":"明的軟木板上貼著每一章的便利貼，可以回頭看大家留了什麼。"},{"from":"第三章","text":"劇情裡用手機拍的照片，會放在相簿的「我拍的」分頁。"},{"from":"第三章","text":"手機「寫程式」→「明的小遊戲」，可以重玩劇情裡玩過的小遊戲。"},{"from":"第三章","text":"相簿、音樂、圖鑑和植物的收集，重新開始遊戲也會留著。"},{"from":"第三章","text":"自由時間走到工作室南邊的圓拱門，按「出門到島上」，就能去島上逛。"},{"from":"第三章","text":"島上的小生物要點一下才會收進圖鑑。全島地圖右上角的「圖鑑」可以看收了幾種。"},{"from":"第三章","text":"全島地圖右上角的「植物」會列出每種植物在哪裡、怎麼拿。帶回工作室可以放在小台子上澆水。"},{"from":"第三章","text":"工作室的植物一天能澆一次水，澆滿三天就會長大。"},{"from":"第三章","text":"朝霞丘櫻花樹下的小苗，要先把顏色找回來才拿得走。花田邊還撿得到鬱金香的球根。"},{"from":"第三章","text":"晨的畫板一開始只有黑、灰、白，在島上把顏色找回來以後，畫板會多出新的顏色。"},{"from":"第三章","text":"朝霞丘小屋門口睡著一隻貓，摸摸牠，牠會跟著妳走一小段，也會收進圖鑑。"},{"from":"第三章","text":"落地鏡可以幫茶語換衣服和配件，換好以後她會穿著在工作室裡走。"},{"from":"第三章","text":"照片牆可以挑六張天空的照片夾上去。"},{"from":"第三章","text":"望遠鏡可以看島上已經開放的地方，往左或往右拖就能移動鏡頭。"},{"from":"第三章","text":"第三章之後再去朝霞丘找晨聊聊，他會請妳去花田摘一朵特別大的藍色花。"},{"from":"第四章","text":"想請詩做歌，就到東邊音樂角點「詩的耳機」，選「請詩做歌」，寫下想聽什麼樣的歌。"},{"from":"第四章","text":"詩做好的歌會收在詩的耳機裡，明的電腦的「收藏」也有一份。"},{"from":"第四章","text":"海灘石頭後面躲著寄居蟹，用「呼喚」叫牠出來，牠讓出來的大貝殼裡有空氣鳳梨。"},{"from":"第四章","text":"第四章之後去海灘找詩，他會請妳到浪邊錄一段海浪聲。等浪打上來的時候再錄。"},{"from":"第四章","text":"海灘浪邊的最左邊可以下潛，海裡的小魚群和水母點一下也會收進圖鑑。"},{"from":"第五章","text":"月光岬的月見草一開就合起來，先按「停下時間」才摘得到。"},{"from":"第五章","text":"第五章之後去月光岬找明，他會請妳看看鐘塔門口右邊那盞燈。停下時間再看，就知道哪裡怪怪的。"},{"from":"第五章","text":"月光岬的螢火蟲，妳站著不動就會飛過來。飛很快的那幾隻，要停下時間才看得清楚。"},{"from":"通關後","text":"看完真結局再開始遊戲，可以選「回到小島」，回工作室和島上自由逛。"},{"from":"通關後","text":"看完真結局以後，三個人的個人線都能選，也可以選三個人一起。"},{"from":"通關後","text":"真結局之後，在碼頭坐船繞島，就看得到遠海的鯨魚。"},{"from":"通關後","text":"圖鑑一共有十三種小生物，收齊會得到一張四個人在島上的畫。"},{"from":"通關後","text":"工作室的植物在通關後照現實的日子長，明天回來還能再澆一次水。"},{"from":"通關後","text":"真結局三樣禮物都拿到後，全島地圖右上角可以按「一起種小樹」，和大家在碼頭邊種一棵樹。"}]</script>
<script>
(() => {
  const screen = document.getElementById('page-loading');
  if (parent !== window && window.name === 'larch-page-shell') {
    screen.previousElementSibling.remove();
    screen.remove();
    return;
  }
function chapterTip(tips, requested, islandStage) {
  const PHONE_APP_ENABLED = false;
  const chapters = new Map([
    ['ch1', '第一章'], ['interlude1', '小插曲一'], ['ch2', '第二章'], ['interlude2', '小插曲二'],
    ['ch3', '第三章'], ['interlude3', '小插曲三'], ['ch4', '第四章'], ['interlude4', '小插曲四'],
    ['ch5', '第五章'], ['ch6', '第六章'], ['interlude5', '小插曲五'], ['ch7', '第七章'],
    ['morning', '通關後'], ['bright', '通關後'], ['poem', '通關後'], ['partners', '通關後'],
    ['true_end', '通關後'],
  ]);
  const stages = [...new Set(chapters.values())];
  const stageChapters = ['ch1', 'ch3', 'ch4', 'ch5', 'true_end'];
  const normalized = /^[1-7]$/.test(requested) ? 'ch' + requested :
    /^(true|trueending|真結局)$/i.test(requested) ? 'true_end' : requested;
  const chapter = chapters.has(normalized) ? normalized :
    ([...chapters].find(([, stage]) => stage === normalized)?.[0] ??
      stageChapters[Number(islandStage) - 1] ?? 'ch1');
  const unused = tips.filter(tip => stages.includes(tip.from) &&
    (!tip.needs || (tip.needs === 'phone_app' && PHONE_APP_ENABLED)));
  // 依順序替各章挑一則並移出池子，每次開頁都會得到同一份分配。
  for (const [key, stage] of chapters) {
    const rank = stages.indexOf(stage);
    const eligible = unused.filter(tip => stages.indexOf(tip.from) <= rank);
    const tip = eligible.length ? eligible[(rank + unused.length) % eligible.length] : null;
    if (key === chapter) {
      return { tip, eligible, chapter };
    }
    if (tip) unused.splice(unused.indexOf(tip), 1);
  }
}

  const loadingParams = new URLSearchParams(location.search);
  const tips = JSON.parse(document.getElementById('chapter-tips').textContent);
  const { tip, eligible, chapter } = chapterTip(tips, loadingParams.get('chapter'), loadingParams.get('stage'));
  const text = screen.querySelector('#tip-text');
  text.textContent = tip?.text || '';
  const cast = "island";
const from = { dawn: '朝霞丘', beach: '海灘舞台', cape: '月光岬' };
  const originKey = loadingParams.get('from');
  if (loadingParams.get('diveDone') === '1') screen.querySelector('.lab.a').textContent = '海底';
  else if (Object.hasOwn(from, originKey)) screen.querySelector('.lab.a').textContent = from[originKey];
function loadingScreen(screen, cast) {
  const track = screen.querySelector('.track');
  const fill = track.querySelector('.fill');
  const walker = track.querySelector('.walker');
  const finish = track.querySelector('.pt.b');
  const percent = screen.querySelector('.pct');
  const row = screen.querySelector('.cast');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const turn = 2 * Math.PI;
  const wrap = (time, period, offset = 0) => ((time + offset) / period) % 1;
  const animals = {
    bird: [.34, t => [wrap(t, 7, 1.5) * 1.15 - .1, .12 + .06 * Math.sin(t * 2.2)], 8],
    butterfly: [.30, t => [.55 + .28 * Math.sin(t * .55), .30 + .14 * Math.sin(t * 1.7),
      8 * Math.sin(t * 1.7), .55 + .45 * Math.abs(Math.cos(t * 9))]],
    crab: [.40, t => [.10 + .55 * (.5 - .5 * Math.cos(t * .7)), .58 + .02 * Math.abs(Math.sin(t * 6))]],
    gull: [.32, t => [wrap(t, 9, 1.5) * 1.15 - .1, .08 + .05 * Math.sin(t * 1.5)], 6],
    fishA: [.22, t => [wrap(t, 8, 1.2) * 1.2 - .12, .15 + .03 * Math.sin(t * 2)]],
    fishB: [.20, t => [wrap(t, 10, 3) * 1.2 - .12, .45 + .03 * Math.sin(t * 2.4)]],
    fishC: [.24, t => [wrap(t, 7, 6) * 1.2 - .12, .70 + .03 * Math.sin(t * 1.8)]],
    jellyA: [.42, t => [.62, .18 + .10 * Math.sin(t * .9)]],
    jellyB: [.36, t => [.82, .30 + .10 * Math.sin(t * .9 + 1.6)]],
    turtle: [.34, t => [wrap(t, 14, 2) * 1.2 - .12, .40 + .04 * Math.sin(t * 1.2)], 2],
    whale: [.53, t => [.36 + .13 * Math.sin(t * .63), .30 + .04 * Math.sin(t * 1.5)], 3],
    firefly: [.22, t => [.28 + .13 * Math.sin(t * .85), .32 + .14 * Math.sin(t * 1.3)]],
  };
  let target = 0;
  let shown = 0;
  let frame;
  let previous;
  let walkTime = 0;
  let lastPercent = 0;
  let lastPosition;
  let art;
  let castFrames = [];
  let tea;
  let arrival;
  let width = 0;
  let height = 0;

  function sprite(src, key) {
    const image = new Image();
    image.alt = '';
    image.dataset.sprite = key;
    image.decoding = 'async';
    image.src = src;
    image.decode().then(() => image.classList.add('decoded'), () => {});
    return image;
  }

  row.classList.add(cast);
  row.setAttribute('aria-hidden', 'true');
  walker.setAttribute('aria-hidden', 'true');
  const resize = new ResizeObserver(([entry]) => {
    ({ width, height } = entry.contentRect);
  });
  if (cast === 'sea') resize.observe(row);

  function mountArt() {
    if (!art) return;
    tea = sprite(art.walker[0], 'walker');
    walker.append(tea);
    castFrames = Object.entries(art).filter(([key]) => key !== 'walker').map(([key, urls]) => {
      const frames = urls.map(url => sprite(url, key));
      row.append(frames[0]);
      return { key, frames, image: frames[0] };
    });
    art = undefined;
  }

  function drawProgress() {
    const value = shown.toFixed(2) + '%';
    if (value !== lastPosition) {
      fill.style.width = value;
      walker.style.left = value;
      lastPosition = value;
    }
    const number = shown === 100 ? 100 : Math.min(99, Math.round(shown));
    if (number !== lastPercent) {
      percent.textContent = number + '%';
      track.setAttribute('aria-valuenow', number);
      lastPercent = number;
    }
  }

  function draw(now) {
    frame = undefined;
    if (!screen.isConnected) {
      screen.stopLoadingMotion();
      return;
    }
    mountArt();
    const dt = previous === undefined ? 16 : Math.min(now - previous, 50);
    previous = now;
    const moving = Math.abs(target - shown) >= .15;
    if (arrival) {
      const elapsed = Math.min(1, (now - arrival.at) / 145);
      shown = 100 - (100 - arrival.from) * (1 - elapsed) ** 2;
      if (elapsed === 1) arrival = undefined;
    } else {
      shown = moving ? shown + (target - shown) * (1 - Math.exp(-dt / 115)) : target;
    }
    drawProgress();
    if (tea) {
      if (shown < 100 && moving) walkTime += dt;
      else walkTime = 0;
      const step = walkTime / 1200 * turn;
      const bob = -4 * Math.abs(Math.sin(step));
      tea.style.transform = walkTime ? `translateY(${bob}px) rotate(${-3 * Math.cos(step)}deg)` : '';
    }
    const glow = .5 - .5 * Math.cos(now / 1600 * turn);
    finish.style.boxShadow = `0 0 0 ${6 + 4 * glow}px rgb(232 194 122 / ${.2 - .133 * glow})`;
    castFrames.forEach((actor, index) => {
      if (cast === 'crew') {
        const phase = (now / 1800 - index * .25) * turn;
        actor.image.style.transform = `translateY(${-6 * (1 - Math.cos(phase))}px) rotate(${5 * Math.sin(phase)}deg)`;
        return;
      }
      const [size, path, fps] = animals[actor.key];
      const seconds = now / 1000;
      const [x, y, tilt = 0, flap = 1] = path(seconds);
      if (fps) {
        const next = actor.frames[Math.floor(seconds * fps) % actor.frames.length];
        if (next !== actor.image && next.classList.contains('decoded')) {
          actor.image.replaceWith(next);
          actor.image = next;
        }
      }
      actor.image.style.height = height * size + 'px';
      actor.image.style.transform = `translate(${x * width}px,${y * height}px) rotate(${tilt}deg) scaleX(${flap})`;
    });
    frame = requestAnimationFrame(draw);
  }

  function updateMotion() {
    if (motion.matches) {
      arrival = undefined;
      cancelAnimationFrame(frame);
      frame = undefined;
      previous = undefined;
      finish.style.boxShadow = '';
      shown = target;
      drawProgress();
      return;
    }
    if (frame === undefined) {
      frame = requestAnimationFrame(now => {
        // 文字與小路先有一幀，再開始解碼獨立裝飾圖。
        frame = requestAnimationFrame(draw);
      });
    }
  }

  screen.setLoadingArt = assets => { art = assets; };
  screen.setLoadingProgress = (ratio, immediate = false) => {
    target = Math.min(100, Math.max(0, ratio * 100));
    if (immediate || motion.matches) {
      shown = target;
      if (tea) tea.style.transform = '';
      drawProgress();
    }
  };
  screen.finishLoadingProgress = () => {
    if (motion.matches) screen.setLoadingProgress(1, true);
    else {
      target = 100;
      arrival = { at: performance.now(), from: shown };
    }
  };
  screen.stopLoadingMotion = () => {
    cancelAnimationFrame(frame);
    resize.disconnect();
    motion.removeEventListener('change', updateMotion);
  };
  screen.startLoadingMotion = () => {
    motion.addEventListener('change', updateMotion);
    updateMotion();
  };
}

function deferLoadingScreen(screen) {
  const backdrop = screen.previousElementSibling;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let enteredAt;
  const enter = setTimeout(() => {
    screen.classList.add('entered');
    enteredAt = performance.now();
    screen.removeAttribute('inert');
    screen.startLoadingMotion();
  }, 500);

  return (ready, done, reveal = () => {}) => {
    clearTimeout(enter);
    function remove() {
      screen.stopLoadingMotion();
      screen.remove();
      backdrop.remove();
      done();
    }
    if (enteredAt === undefined) {
      reveal();
      remove();
      return;
    }
    if (ready) screen.finishLoadingProgress();
    const leave = () => {
      reveal();
      screen.setAttribute('inert', '');
      screen.classList.add('leaving');
      if (motion.matches) {
        remove();
        return;
      }
      function finishFade() {
        clearTimeout(fallback);
        screen.removeEventListener('transitionend', afterFade);
        remove();
      }
      function afterFade(event) {
        if (event.target !== screen || event.propertyName !== 'opacity') return;
        finishFade();
      }
      const fallback = setTimeout(finishFade, 250);
      screen.addEventListener('transitionend', afterFade);
    };
    const remaining = 800 - (performance.now() - enteredAt);
    if (remaining > 0) setTimeout(leave, Math.ceil(remaining));
    else leave();
  };
}

  const dismiss = deferLoadingScreen(screen);
  screen.dismiss = (ready = false) => new Promise(resolve => {
    clearTimeout(deadline);
    dismiss(ready, resolve);
  });
  const deadline = setTimeout(() => {
    if (window.PageLoading) window.PageLoading.timeout();
    else {
      console.warn('[page-loading] 載入逾時', screen.parentElement.querySelector('script[src]')?.src);

/* Larch 安全區（2026-11-22 實量，作者試玩：朝霞丘地名被章名膠囊蓋住）：播放器左上角一直顯示章名膠囊（高 28、上緣 14，最長章名約 320px 寬），右上是常駐 HUD＋關閉鈕（--hud-clear），右下是底部按鈕列（離底 13–49px，寬約 600）；手機直式上緣 112px 整條、底部 54px 整條都被蓋。自家介面：左上從 --larch-top-left 起、貼底的離底至少 --larch-bottom。 */
/* --hud-clear：Larch 的常駐介面（右上角三顆愛心＋手機的紙卡＋底下的日期紙卡「第 N 天・時段」，框 258×112、離右邊 48px；播放器關閉鈕在它右邊）蓋在這頁上面，
   右上角自己的元件從它底下開始排（112px＋12px 間隔）；手機直式時紙卡橫跨上緣大半，左上角的地名也往下移（作者 2026-11-21 試玩：疊在一起）。新版/hud/README.md「收起」段 */
:root{--hud-clear:calc(124px + env(safe-area-inset-top,0px));--larch-top-left:56px;--larch-bottom:64px;color-scheme:light;--ink:#5a4150;--dim:#8a7080;--paper:#fbf7ef;--sea:#203744;font-family:"LXGW WenKai TC","Iansui","Kaiti TC","Noto Sans TC",serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:var(--sea);color:var(--ink)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--sea)}
#world{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:transparent}
#map-area{--camera-x:0px;--camera-y:0px;position:absolute;left:50%;top:50%;width:max(100vw,150dvh);height:max(66.666667vw,100dvh);aspect-ratio:3/2;transform:translate(calc(-50% + var(--camera-x)),calc(-50% + var(--camera-y)));overflow:visible;isolation:isolate}
#map-area.zooming{transition:width .9s ease-in-out,height .9s ease-in-out,transform .9s ease-in-out}
/* 底圖是四周延伸畫好的整張（真結局/map2d/art/out/island_ext_*.jpg）；#map-area 仍是原圖 1536×1024 那一塊，入口、步道、路線座標都以它為 0～1，
   #map 與雲層的 left/top/width/height 由 island_play.js 照 island_config.json 的 ext、cloudLayer.box 換算 */
#paint{position:absolute;inset:0;pointer-events:none}
#map,#clouds{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none}
/* 雲層蓋在紙片上面（紙片從雲底下經過）。雲層自己帶一份夕照罩層，用雲的透明度當遮罩，只罩在雲上，跟底圖被 #shade 罩過的雲一樣 */
#cloudwrap{position:absolute;z-index:11;pointer-events:none;isolation:isolate;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#clouds{left:0;top:0;width:100%;height:100%}
#cloudwrap .shade{position:absolute;pointer-events:none}
#shade{position:absolute;left:-120%;top:-120%;width:340%;height:340%;pointer-events:none;background:transparent;z-index:9}
.shade i{position:absolute;inset:0;display:none;mix-blend-mode:soft-light}
/* 第 1～4 階段黃昏：色彩矩陣由 island_s5.jpg 對 island_s5_dusk.jpg 逐像素擬合，再混入暖色對角矩陣保住淺海的飽和度；外圈紫藍天光與左上夕照用 soft-light 疊。漸層座標以 #shade（地圖每邊外擴 120%，蓋過整張延伸圖）為基準；雲層套同一個濾鏡，從雲下經過的紙片在 #shade 底下，一起罩上夕照。 */
#map-area.dusk #paint,#map-area.dusk #clouds{filter:url(#dusk-grade) saturate(var(--dusk-saturate,1.1)) contrast(var(--dusk-contrast,1.08))}
#map-area.dusk .shade i{display:block}

#map-area.night .shade{background:rgba(35,47,91,.32)}
#map-area.dawn .shade{background:rgba(88,111,148,.09)}
/* 天黑（第七章評審週陪完回全島）：整張壓暗、偏藍。顏色是拿第 5 階段「天剛暗」那張圖對白天那張量的平均比例（紅 .50、綠 .45、藍 .71），用相乘疊上去 */
#map-area.dark .shade{background:rgb(128,115,181);mix-blend-mode:multiply}

#zones{z-index:14}.entrance{position:absolute;width:10%;height:15%;transform:translate(-50%,-50%);border:0;border-radius:50%;padding:0;background:transparent;color:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.entrance:focus-visible{outline:3px dashed #fff8d9}.entrance::after{content:attr(data-name);position:absolute;left:50%;bottom:100%;padding:.35em 1em .42em;border:1px solid #fff9;border-radius:3px;background:#fff1ddef;color:var(--ink);font:700 clamp(12px,1.7vw,18px)/1.2 var(--hand);letter-spacing:.1em;white-space:nowrap;opacity:0;transform:translate(-50%,8px) rotate(-2deg);transition:opacity .2s,transform .2s;filter:drop-shadow(0 3px 3px #41394c66)}
.entrance.nearby::after,.entrance.passing::after,.entrance:hover::after,.entrance:focus-visible::after{opacity:1;transform:translate(-50%,0) rotate(-2deg)}
.entrance.nearby,.entrance.passing{box-shadow:0 0 0 3px #fff4a8aa,0 0 26px 12px #fff8a688;animation:zoneglow 1.2s ease-in-out infinite alternate}
@keyframes zoneglow{to{box-shadow:0 0 0 8px #fff4a866,0 0 38px 20px #fff8a6bb}}
#memory{z-index:13}.memory{position:absolute;width:5.7%;height:auto;transform:translate(-50%,-75%);pointer-events:auto;cursor:pointer;filter:drop-shadow(0 3px 4px #44314f88);animation:memfloat 2s ease-in-out infinite}.memory.nearby{filter:drop-shadow(0 0 10px #fff3aacc) drop-shadow(0 4px 5px #44314f99);scale:1.16}
@keyframes memfloat{50%{translate:0 -5px;rotate:3deg}}
/* 紙片在夕照罩層（z 9）上面、雲層（z 11）底下：從雲下面經過時被雲蓋住 */
#vehicle{z-index:10;display:none;transform:translate(-50%,-55%);overflow:visible;pointer-events:none;filter:drop-shadow(0 5px 4px #243d4c88)}
#vehicle.on{display:block}.vehicle-art{position:absolute;inset:0;width:100%;height:100%;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -2px;rotate:-1.5deg}to{translate:0 3px;rotate:1.5deg}}
#whale{z-index:10;display:none;inset:auto;overflow:visible;filter:drop-shadow(0 3px 4px #20374666)}#whale.on{display:block}
#whale img{position:absolute;bottom:0;left:50%;translate:-50% 0;height:auto;opacity:0;transition:opacity .25s}#whale img.on{opacity:1}
#label,#hint,#progress{position:fixed;z-index:12;padding:.5em 1.2em .55em;border:1px solid #ffffffbb;border-radius:3px;background:#fff3e8ed;color:var(--ink);box-shadow:0 4px 12px #221e2d44;backdrop-filter:blur(5px);letter-spacing:.1em;pointer-events:none}
#label{top:max(var(--larch-top-left),env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));font-weight:700}#hint{top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:14px;color:var(--dim);white-space:nowrap}#progress{top:var(--hud-clear);right:max(12px,env(safe-area-inset-right));font-size:14px}
#actions{position:fixed;z-index:13;top:calc(var(--hud-clear) + 54px);right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;flex-direction:column;align-items:flex-end}
.action,.move{border:1px solid #fff9;border-radius:4px;background:#fff0e2ed;color:var(--ink);font:700 15px/1.25 var(--hand);letter-spacing:.08em;box-shadow:0 4px 12px #221e2d44;cursor:pointer;touch-action:manipulation}.action{padding:.55em 1em}.action[hidden]{display:none}.action:active,.move:active{transform:translateY(2px)}
#move{position:fixed;z-index:14;left:max(12px,env(safe-area-inset-left));bottom:max(var(--larch-bottom),env(safe-area-inset-bottom));display:flex;gap:10px}
.move{width:62px;height:58px;font-size:28px;background:#fff0e2d9;touch-action:none}
#dialog{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#1c233bb0;cursor:pointer}#dialog.on{display:grid}
#dialog .paper{width:min(760px,calc(100vw - 36px));padding:clamp(28px,6vw,64px);background:repeating-linear-gradient(0deg,#fffaf1,#fffaf1 2px,#f7f0e6 3px,#fffaf1 5px);border:2px solid #fff8e8;border-radius:8px;box-shadow:0 12px 42px #130e1c99;transform:rotate(-1deg);animation:unroll .35s ease-out}
@keyframes unroll{from{transform:rotate(-1deg) translateY(14px);opacity:0}}
#dialog b{display:block;margin-bottom:.6em;color:var(--dim);font-size:17px;letter-spacing:.12em}#dialog p{margin:0;font-size:clamp(20px,4vw,28px);line-height:1.7;letter-spacing:.04em}#dialog small{display:block;margin-top:1em;text-align:right;color:var(--dim)}
.toast{position:fixed;z-index:18;left:50%;bottom:max(92px,calc(env(safe-area-inset-bottom) + 78px));transform:translate(-50%,14px);padding:.55em 1.2em;background:#fff3e8ed;border:1px solid #fff9;border-radius:4px;box-shadow:0 4px 12px #221e2d44;color:var(--ink);font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
body.debug #world{outline:2px dashed #fff}body.debug .entrance{background:#f00a;border:1px solid #fff}body.debug #person::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,transparent 49.9%,#fff5 50%,transparent 50.1%);pointer-events:none}
body.orbiting #move,body.orbiting #actions,body.orbiting #label,body.orbiting #progress{display:none}body.orbiting #hint{padding:.3em .9em;font-size:12px;top:max(8px,env(safe-area-inset-top));bottom:auto}body.orbiting .toast{top:max(54px,calc(env(safe-area-inset-top) + 44px));bottom:auto}
@media(max-width:700px){#label{top:var(--hud-clear)}body.orbiting #hint{top:auto;bottom:max(var(--larch-bottom),env(safe-area-inset-bottom))}body.orbiting .toast{top:auto;bottom:max(52px,calc(env(safe-area-inset-bottom) + 48px))}#hint{top:auto;bottom:max(var(--larch-bottom),env(safe-area-inset-bottom));left:160px;right:12px;transform:none;white-space:normal;text-align:left;font-size:12px}#progress{top:auto;bottom:max(148px,calc(env(safe-area-inset-bottom) + 142px));right:10px;font-size:12px}#actions{top:auto;bottom:max(154px,calc(env(safe-area-inset-bottom) + 148px));right:10px}.action{font-size:13px}.entrance{width:14%;height:24%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
