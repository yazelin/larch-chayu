<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朝霞丘（第一版：六層視差，留著比較）</title>
<style>
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#2a2026;color:#382c2b;font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}
#stage{position:fixed;inset:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#label{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));padding:8px 14px;border:1px solid rgba(255,250,242,.85);border-radius:999px;background:rgba(255,250,242,.9);font-size:14px;font-weight:700;letter-spacing:.08em;box-shadow:0 3px 14px rgba(26,18,18,.16);pointer-events:none}
#hint{position:fixed;z-index:8;left:50%;top:max(62px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:7px 13px;border:1px solid rgba(255,250,242,.76);border-radius:999px;background:rgba(40,32,35,.54);color:#fffaf2;font-size:13px;text-align:center;white-space:nowrap;pointer-events:none;backdrop-filter:blur(4px)}
#near{position:fixed;z-index:9;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 16px;border:1px solid rgba(255,250,242,.9);border-radius:999px;background:rgba(255,250,242,.96);font-size:15px;font-weight:700;box-shadow:0 5px 18px rgba(26,18,18,.22);cursor:pointer;display:none}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(20,14,16,.55);opacity:0;pointer-events:none;transition:opacity .2s ease}
#panel{position:fixed;z-index:21;left:50%;top:50%;width:min(460px,calc(100vw - 32px));transform:translate(-50%,-47%) scale(.98);opacity:0;pointer-events:none;border:2px solid #c6a987;border-radius:16px;background:#fbf4e8;box-shadow:0 16px 50px rgba(0,0,0,.3);transition:transform .22s ease,opacity .22s ease;padding:18px 20px}
#panel.on,#scrim.on{opacity:1;pointer-events:auto}#panel.on{transform:translate(-50%,-50%) scale(1)}
#panel h2{margin:0 0 8px;font-size:18px}#panel p{margin:0 0 10px;line-height:1.6}#panel button{min-height:40px;padding:7px 16px;border:1px solid #c6a987;border-radius:999px;background:#fff;font-weight:700;cursor:pointer}
#cg{position:fixed;inset:0;z-index:30;display:none;background:#1c1418;cursor:pointer}#cg img{width:100%;height:100%;object-fit:contain}
#cg span{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(40,32,35,.7);color:#fffaf2;font-size:14px}
body.nohud #label,body.nohud #hint,body.nohud #near{display:none!important}
</style>
</head>
<body>
<canvas id="stage" aria-label="朝霞丘：橫向捲軸場景"></canvas>
<div id="label">朝霞丘</div>
<div id="hint">方向鍵或 A、D 移動，也可以點地面、入口或物件走過去</div>
<button id="near" type="button"></button>
<div id="scrim"></div>
<div id="panel" role="dialog"><h2 id="panel-title"></h2><div id="panel-body"></div><button id="panel-close" type="button">關閉</button></div>
<div id="cg"><img id="cg-img" alt="朝霞丘的日出"><span>點一下回到山丘</span></div>
<script src="../../../studio_web/studio_storage.js"></script>
<script type="module" src="scroll_engine.js"></script>
</body>
</html>
